<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Noise Terrain Generator</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/",
            "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.1/dist/esm/simplex-noise.js"
        }
    }
    </script>
</head>
<body>
    <div id="container">
        <canvas id="terrainCanvas"></canvas>
        <div id="controls">
            <h1>3D Noise Terrain</h1>
            <div class="control-group">
                <button id="generate">Regenerate Terrain</button>
            </div>
            <div class="control-group">
                <label>Terrain Scale:</label>
                <input type="range" id="scaleSlider" min="0.01" max="0.2" step="0.01" value="0.05">
            </div>
            <div class="control-group">
                <label>Amplitude:</label>
                <input type="range" id="amplitudeSlider" min="5" max="50" step="1" value="25">
            </div>
            <div class="control-group">
                <label>Octaves:</label>
                <input type="range" id="octavesSlider" min="1" max="5" step="1" value="3">
            </div>
        </div>
    </div>
    <script type="module" src="config.js"></script>
    <script type="module" src="terrainGenerator.js"></script>
    <script type="module" src="main.js"></script>

</body>
</html>
